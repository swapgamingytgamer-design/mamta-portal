<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Showcase | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #001f3f; --accent: #d4af37; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial Black', sans-serif; }
        body { background: #f4f7f6; color: #333; overflow-x: hidden; }

        /* HEADER & NAV (Standardized) */
        header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; }
        .h-left img { height: 100px; }
        .h-center { flex-grow: 1; padding-left: 30px; }
        .h-center h1 { color: #001f3f; font-size: 2.3rem; margin: 0; line-height: 1.1; }
        .h-center p { color: var(--accent); font-size: 0.9rem; font-weight: bold; margin-top: 8px; }
        .h-right { text-align: right; display: flex; flex-direction: column; gap: 6px; min-width: 300px; }
        .info-txt { font-weight: 900; color: #001f3f; font-size: 1.1rem; display: flex; justify-content: flex-end; align-items: center; }
        .info-txt a { text-decoration: none; color: inherit; }
        .info-txt i { color: var(--midnight); margin-right: 10px; }

        nav { background: #001f3f; padding: 0 5%; display: flex; justify-content: center; position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; padding: 18px 25px; text-decoration: none; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
        nav a:hover { color: var(--accent); background: rgba(255,255,255,0.1); }

        /* FORM DESIGN */
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-top: 10px solid #e4405f; /* Pink/Artistic color */ }
        .form-card h2 { color: var(--midnight); text-align: center; margin-bottom: 10px; }
        .form-card p.subtitle { text-align: center; color: #666; margin-bottom: 30px; font-family: 'Arial', sans-serif; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--midnight); font-size: 0.95rem; font-weight: bold; }
        .required-star { color: #ff4d4d; }
        
        .form-group input, .form-group textarea {
            width: 100%; padding: 14px; border: 2px solid #e1e1e1; border-radius: 10px; font-family: 'Arial', sans-serif; font-size: 1rem; outline: none; transition: 0.3s;
        }
        .form-group input[type="file"] { padding: 10px; background: #fafafa; border: 2px dashed #ccc; cursor: pointer; }
        .form-group input:focus, .form-group textarea:focus { border-color: #e4405f; background: #fff9fa; }
        
        .submit-btn { 
            background: #e4405f; color: white; width: 100%; padding: 18px; border: none; 
            border-radius: 12px; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.4s; margin-top: 15px;
            text-transform: uppercase;
        }
        .submit-btn:hover { background: #d62976; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(228,64,95,0.3); }

        footer { background: #001f3f; color: white; padding: 40px; text-align: center; margin-top: 60px; }
        footer b { color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="h-left"><img src="../assets/people/logo.png" onerror="this.src='https://via.placeholder.com/100'"></div>
        <div class="h-center"><h1>MAMTA MODERN SCHOOL</h1><p>NURTURING EXCELLENCE SINCE 1973</p></div>
        <div class="h-right">
            <div class="info-txt"><a href="tel:+911145614501"><i class="fa-solid fa-phone"></i>+91-11-45614501</a></div>
        </div>
    </header>
    
    <nav>
        <a href="../index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="gallery.html">Gallery</a>
        <a href="circulars.html">Circulars</a>
        <a href="suppliers.html">Suppliers</a>
        <a href="policies.html">Policies</a>
        <a href="showcase.html" style="color: var(--accent);">Showcase</a>
        <a href="admission.html">Admissions</a>
        <a href="complaints.html">Complaints</a>
    </nav>

    <div class="container">
        <div class="form-card">
            <h2>Submit Your Creativity</h2>
            <p class="subtitle">Share your poems, stories, or artwork with the school community!</p>
            
            <form action="https://api.web3forms.com/submit" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="access_key" value="6984aa09-04d4-4a31-98ff-65cb3209cf62">
                <input type="hidden" name="subject" value="New Student Showcase Submission">

                <div class="form-group">
                    <label>Student Full Name <span class="required-star">*</span></label>
                    <input type="text" name="student_name" placeholder="Your Name" required>
                </div>

                <div class="form-group">
                    <label>Class & Section <span class="required-star">*</span></label>
                    <input type="text" name="class_section" placeholder="e.g. 7th-A" required>
                </div>

                <div class="form-group">
                    <label>Contact Number <span class="required-star">*</span></label>
                    <input type="tel" name="phone" placeholder="Parent's 10-digit number" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label>Email Address <span class="required-star">*</span></label>
                    <input type="email" name="email" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label>Upload Your Photo/Artwork <span class="required-star">*</span></label>
                    <input type="file" name="attachment" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label>Your Poem or Story <span class="required-star">*</span></label>
                    <textarea name="creativity_content" rows="8" placeholder="Type your poem or story here..." required></textarea>
                </div>

                <input type="checkbox" name="botcheck" style="display: none;">

                <button type="submit" class="submit-btn">Submit My Work</button>
            </form>
        </div>
    </div>

    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>

</body>
</html>
