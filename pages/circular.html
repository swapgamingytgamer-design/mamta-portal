<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circulars | Mamta Modern School</title>
    <style>
        :root { 
            --midnight: #0f172a; 
            --accent: #d4af37; 
            --soft-bg: #f8fafc;
            --white: #ffffff;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: var(--soft-bg); color: #334155; line-height: 1.6; }

        /* THE SHARED SUPER HEADER */
        .super-header { 
            background: var(--white); 
            padding: 20px 5%; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 4px solid var(--accent);
            gap: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-img { height: 85px; width: auto; }
        .school-title h1 { font-size: 1.6rem; font-weight: 800; color: var(--midnight); letter-spacing: -1px; }
        .school-title p { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; }

        .header-right { text-align: right; min-width: 250px; }
        .header-info { display: block; font-size: 0.85rem; font-weight: 600; text-decoration: none; color: var(--midnight); margin-bottom: 4px; }
        .header-info b { color: var(--accent); margin-right: 5px; }

        /* SHARED NAV */
        nav { background: var(--midnight); padding: 15px; position: sticky; top: 0; z-index: 1000; text-align: center; }
        nav a { color: #cbd5e1; margin: 0 15px; text-decoration: none; font-weight: 600; font-size: 0.85rem; transition: 0.3s; }
        nav a:hover { color: var(--accent); }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; min-height: 60vh; }
        
        .page-header { text-align: center; margin-bottom: 40px; }
        .page-header h2 { font-size: 2rem; color: var(--midnight); }
        .underline { width: 50px; height: 4px; background: var(--accent); margin: 10px auto; border-radius: 2px; }

        /* CIRCULAR LIST */
        .circular-list { background: var(--white); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid #e2e8f0; }
        
        .circular-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 25px; 
            border-bottom: 1px solid #f1f5f9;
            transition: 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .circular-item:hover { background: #fffbeb; }

        .circ-meta { display: flex; flex-direction: column; }
        .circ-date { font-size: 0.75rem; font-weight: 800; color: var(--accent); text-transform: uppercase; }
        .circ-title { font-weight: 700; color: var(--midnight); font-size: 1rem; }

        /* EMPTY STATE STYLE */
        .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; display: none; }
        .empty-state span { font-size: 4rem; display: block; margin-bottom: 15px; }

        @media (max-width: 600px) {
            .super-header { flex-direction: column; text-align: center; }
            .header-right { border-top: 1px solid #f1f5f9; padding-top: 15px; width: 100%; text-align: center; }
        }

        footer { text-align: center; padding: 50px; color: #94a3b8; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header class="super-header">
        <div class="header-left">
            <img src="../assets/people/logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/85'">
            <div class="school-title">
                <h1>MAMTA MODERN SCHOOL</h1>
                <p>Est. 1973 | Golden Jubilee Year</p>
            </div>
        </div>
        <div class="header-right">
            <a href="tel:+911145614501" class="header-info"><b>📞</b> +91-11-45614501</a>
            <a href="mailto:mamtamodernschool@gmail.com" class="header-info"><b>📧</b> mamtamodernschool@gmail.com</a>
        </div>
    </header>

    <nav>
        <a href="../index.html">HOME</a>
        <a href="gallery.html">GALLERY</a>
        <a href="circulars.html">CIRCULARS</a>
        <a href="suppliers.html">SUPPLIERS</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>School Circulars</h2>
            <div class="underline"></div>
        </div>

        <div class="circular-list" id="circularContainer">
            </div>

        <div id="emptyMessage" class="empty-state">
            <span>📭</span>
            <p>No active circulars at this moment. Please check back later.</p>
        </div>
    </div>

    <footer>
        <p>© 2026 Mamta Modern Sr. Sec. School | Golden Jubilee Year</p>
    </footer>

    <script>
        // Check if there are any circulars
        const container = document.getElementById('circularContainer');
        const emptyMsg = document.getElementById('emptyMessage');
        
        // If there are no <a> tags inside the container, show empty message
        if (container.querySelectorAll('.circular-item').length === 0) {
            container.style.display = 'none';
            emptyMsg.style.display = 'block';
        }
    </script>
</body>
</html>
