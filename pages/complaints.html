<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints & Suggestions | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #001f3f; --accent: #d4af37; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial Black', sans-serif; }
        body { background: #f4f7f6; color: #333; }

        /* HEADER */
        header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; }
        .h-left img { height: 100px; }
        .h-center { flex-grow: 1; padding-left: 30px; }
        .h-center h1 { color: #001f3f; font-size: 2.3rem; margin: 0; line-height: 1.1; }
        .h-center p { color: var(--accent); font-size: 0.9rem; font-weight: bold; margin-top: 8px; }
        .h-right { text-align: right; display: flex; flex-direction: column; gap: 6px; min-width: 300px; }
        .info-txt { font-weight: 900; color: #001f3f; font-size: 1.1rem; display: flex; justify-content: flex-end; align-items: center; }
        .info-txt a { text-decoration: none; color: inherit; }
        .info-txt i { color: var(--midnight); margin-right: 10px; }
        .soc-row { display: flex; justify-content: flex-end; gap: 15px; margin-top: 5px; }
        .soc-row a { font-size: 1.9rem; text-decoration: none; }
        .fa-facebook { color: #1877F2; } .fa-youtube { color: #FF0000; } .fa-instagram { color: #E4405F; }

        /* NAV */
        nav { background: #001f3f; padding: 0 5%; display: flex; justify-content: center; position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; padding: 18px 20px; text-decoration: none; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
        nav a:hover { color: var(--accent); background: rgba(255,255,255,0.1); }

        /* FORM */
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-top: 10px solid var(--midnight); }
        .form-card h2 { color: var(--midnight); margin-bottom: 25px; text-align: center; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--midnight); font-size: 0.9rem; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-family: 'Arial', sans-serif; font-size: 1rem; outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--midnight); background: #fdfdfd; }
        
        .submit-btn { 
            background: var(--midnight); color: var(--accent); width: 100%; padding: 15px; border: 2px solid var(--accent); 
            border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .submit-btn:hover { background: var(--accent); color: var(--midnight); transform: translateY(-2px); }

        footer { background: #001f3f; color: white; padding: 40px; text-align: center; margin-top: 50px; }
        footer b { color: var(--accent); }
    </style>
</head>
<body>
    <header>
        <div class="h-left"><img src="../assets/people/logo.png" onerror="this.src='https://via.placeholder.com/100'"></div>
        <div class="h-center"><h1>MAMTA MODERN SCHOOL</h1><p>NURTURING EXCELLENCE SINCE 1973</p></div>
        <div class="h-right">
            <div class="info-txt"><a href="tel:+911145614501"><i class="fa-solid fa-phone"></i>+91-11-45614501</a></div>
            <div class="info-txt" style="font-size: 0.85rem;"><a href="mailto:mamtamodernschool@gmail.com"><i class="fa-solid fa-envelope"></i>mamtamodernschool@gmail.com</a></div>
            <div class="soc-row">
                <a href="https://www.facebook.com/MamtaModernSeniorSecondarySchoolVikasPuri/" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://www.youtube.com/@MamtaModernSchoolVikasPuri" target="_blank"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://www.instagram.com/mamtamodernschool/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </header>
    
    <nav>
        <a href="../index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="circulars.html">Circulars</a>
        <a href="suppliers.html">Suppliers</a>
        <a href="policies.html">Policies</a>
        <a href="complaints.html" style="color: var(--accent);">Complaints</a>
    </nav>

    <div class="container">
        <div class="form-card">
            <h2>Grievance & Feedback Form</h2>
            
            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="6984aa09-04d4-4a31-98ff-65cb3209cf62">
                
                <input type="hidden" name="subject" value="New Website Grievance Entry">
                <input type="hidden" name="from_name" value="School Website Form">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="Student or Parent Name" required>
                </div>

                <div class="form-group">
                    <label>Class & Section</label>
                    <input type="text" name="class" placeholder="e.g. 7th-B" required>
                </div>

                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" name="phone" placeholder="10-digit mobile number" required>
                </div>

                <div class="form-group">
                    <label>Nature of Submission</label>
                    <select name="type">
                        <option value="Complaint">Complaint</option>
                        <option value="Suggestion">Suggestion</option>
                        <option value="Feedback">Feedback</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Details</label>
                    <textarea name="message" rows="5" placeholder="Please describe your concern clearly..." required></textarea>
                </div>

                <input type="checkbox" name="botcheck" style="display: none;">

                <button type="submit" class="submit-btn">SUBMIT TO OFFICE</button>
            </form>
        </div>
    </div>

    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>
</body>
</html>
