<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Shared Header/Nav CSS same as index.html */
        :root { --midnight: #0f172a; --accent: #d4af37; --white: #ffffff; --soft-bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--soft-bg); }
        .super-header { background: var(--white); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); }
        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .social-icon-row { display: flex; gap: 20px; margin-top: 5px; }
        .dark-social { color: var(--midnight); font-size: 1.8rem; text-decoration: none; }
        nav { background: var(--midnight); padding: 15px; text-align: center; border-bottom: 2px solid var(--accent); }
        nav a { color: #cbd5e1; margin: 0 20px; text-decoration: none; font-weight: 700; }
        
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .gallery-item { border-radius: 20px; overflow: hidden; height: 260px; border: 5px solid #fff; box-shadow: 0 8px 15px rgba(0,0,0,0.08); transition: 0.4s; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
        .gallery-item:hover img { transform: scale(1.1); }
        footer { text-align: center; padding: 50px; background: var(--midnight); color: #cbd5e1; }
    </style>
</head>
<body>
    <header class="super-header">
        <div class="header-left">
            <img src="../assets/people/logo.png" height="90">
            <div class="school-title"><h1>MAMTA MODERN SCHOOL</h1><p>EST. 1973</p></div>
        </div>
        <div class="header-right">
            <div class="contact-row"><span>+91-11-45614501</span></div>
            <div class="social-icon-row">
                <a href="https://www.youtube.com/@MamtaModernSchoolVikasPuri" target="_blank" class="dark-social"><i class="fa-brands fa-square-youtube"></i></a>
                <a href="https://www.facebook.com/MamtaModernSeniorSecondarySchoolVikasPuri/" target="_blank" class="dark-social"><i class="fa-brands fa-circle-facebook"></i></a>
            </div>
        </div>
    </header>
    <nav>
        <a href="../index.html">HOME</a>
        <a href="gallery.html">GALLERY</a>
        <a href="circulars.html">CIRCULARS</a>
        <a href="suppliers.html">SUPPLIERS</a>
    </nav>
    <div class="container"><div class="gallery-grid" id="galleryGrid"></div></div>
    <script>
        const images = [{src:'../assets/events/campus.jpg'}, {src:'../assets/events/sports.jpg'}];
        const grid = document.getElementById('galleryGrid');
        images.forEach(img => {
            grid.innerHTML += `<div class="gallery-item"><img src="${img.src}"></div>`;
        });
    </script>
    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>
</body>
</html>s
