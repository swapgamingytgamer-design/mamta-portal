<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #0f172a; --accent: #d4af37; --soft-bg: #f8fafc; --white: #ffffff; --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--soft-bg); color: #334155; line-height: 1.6; }

        .super-header { background: var(--white); padding: 20px 5%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); gap: 20px; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-img { height: 85px; width: auto; }
        .school-title h1 { font-size: 1.6rem; font-weight: 800; color: var(--midnight); }
        .header-right { text-align: right; }
        .header-info { display: block; font-size: 0.85rem; font-weight: 600; text-decoration: none; color: var(--midnight); margin-bottom: 6px; }
        .header-info i { color: var(--accent); margin-right: 10px; }

        nav { background: var(--midnight); padding: 15px; position: sticky; top: 0; z-index: 1000; text-align: center; }
        nav a { color: #cbd5e1; margin: 0 15px; text-decoration: none; font-weight: 600; font-size: 0.85rem; }
        nav a:hover { color: var(--accent); }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--white); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); border: 1px solid #e2e8f0; }
        .card h2 { color: var(--midnight); border-left: 5px solid var(--accent); padding-left: 15px; margin-bottom: 30px; }

        /* FIXED GALLERY GRID */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .gallery-card { border-radius: 15px; overflow: hidden; border: 4px solid white; box-shadow: var(--shadow); transition: 0.3s; }
        .gallery-card img { width: 100%; height: 250px; object-fit: cover; display: block; }
        .gallery-card:hover { transform: translateY(-5px); border-color: var(--accent); }

        footer { text-align: center; padding: 60px; background: var(--midnight); color: #cbd5e1; margin-top: 50px; }
        footer b { color: var(--accent); }
    </style>
</head>
<body>
    <header class="super-header">
        <div class="header-left">
            <img src="../assets/people/logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/85'">
            <div class="school-title"><h1>MAMTA MODERN SCHOOL</h1><p style="color:var(--accent); font-weight:bold;">GOLDEN JUBILEE</p></div>
        </div>
        <div class="header-right">
            <a href="tel:+911145614501" class="header-info"><i class="fa-solid fa-phone"></i> +91-11-45614501</a>
        </div>
    </header>

    <nav>
        <a href="../index.html">HOME</a>
        <a href="gallery.html">GALLERY</a>
        <a href="circulars.html">CIRCULARS</a>
        <a href="suppliers.html">SUPPLIERS</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>School Gallery</h2>
            <div class="gallery-grid">
                <div class="gallery-card"><img src="../assets/events/award1.jpg"></div>
                <div class="gallery-card"><img src="../assets/events/building.jpg"></div>
                <div class="gallery-card"><img src="../assets/events/award2.jpg"></div>
            </div>
        </div>
    </div>
    <footer><p>© 2026 Mamta Modern School | Developed  by <b>Swapneil Jha</b></p></footer>
</body>
</html>
