<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS Same as index.html above */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .gallery-item { border-radius: 18px; overflow: hidden; height: 250px; border: 4px solid #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.1); transition: 0.4s; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .gallery-item:hover { transform: translateY(-10px); }
        .gallery-item:hover img { transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2 style="border-left: 5px solid var(--accent); padding-left: 15px; margin-bottom: 30px;">School Gallery</h2>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
    </div>

    <script>
        const galleryImages = [
            { src: '../assets/events/campus.jpg', title: 'Main Campus' },
            { src: '../assets/events/sports.jpg', title: 'Sports Day' },
            { src: '../assets/events/award.jpg', title: 'Prize Distribution' }
        ];

        const grid = document.getElementById('galleryGrid');
        galleryImages.forEach(img => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `<img src="${img.src}" title="${img.title}" onerror="this.src='https://via.placeholder.com/400x300?text=Event+Photo'">`;
            grid.appendChild(item);
        });
    </script>
</body>
</html>
