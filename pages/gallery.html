<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Gallery | Mamta Modern</title>
    <style>
        :root { --midnight: #0a192f; --gold: #c5a059; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        .header-main { background: white; padding: 30px 5%; text-align: center; border-bottom: 4px solid var(--gold); }
        .logo-img { height: 90px; }
        nav { background: var(--midnight); padding: 18px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        
        .gallery-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .gallery-item { border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .gallery-item img { width: 100%; height: 250px; object-fit: cover; transition: 0.3s; }
        .gallery-item:hover img { transform: scale(1.05); }
    </style>
</head>
<body>
    <header class="header-main">
        <img src="../assets/people/logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/100'">
        <h1 style="color: var(--midnight);">MAMTA MODERN SR. SEC. SCHOOL</h1>
    </header>
    <nav>
        <a href="../index.html">HOME</a>
        <a href="gallery.html" style="color: var(--gold);">GALLERY</a>
        <a href="circulars.html">CIRCULARS</a>
        <a href="suppliers.html">SUPPLIERS</a>
    </nav>
    <div class="gallery-container">
        <h2 style="text-align: center; margin-bottom: 30px;">School Campus & Events</h2>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="../assets/campus/building.jpg"></div>
            <div class="gallery-item"><img src="../assets/events/event1.jpg" onerror="this.src='https://via.placeholder.com/300x250?text=School+Event'"></div>
            <div class="gallery-item"><img src="../assets/events/event2.jpg" onerror="this.src='https://via.placeholder.com/300x250?text=Science+Lab'"></div>
        </div>
    </div>
</body>
</html>
