<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #0f172a; --accent: #d4af37; --soft-bg: #f8fafc; --white: #ffffff; --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--soft-bg); color: #334155; line-height: 1.6; }

        /* SYNCED HEADER */
        .super-header { background: var(--white); padding: 20px 5%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); gap: 20px; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-img { height: 85px; width: auto; }
        .school-title h1 { font-size: 1.6rem; font-weight: 800; color: var(--midnight); }
        .school-title p { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; }
        .header-right { text-align: right; min-width: 250px; }
        .header-info { display: block; font-size: 0.85rem; font-weight: 600; text-decoration: none; color: var(--midnight); margin-bottom: 6px; transition: 0.3s; }
        .header-info i { color: var(--accent); margin-right: 10px; width: 20px; text-align: center; }
        .social-links { margin-top: 12px; display: flex; gap: 18px; justify-content: flex-end; }
        .social-links a { text-decoration: none; font-size: 1.4rem; color: var(--midnight); transition: 0.3s; }
        .social-links a.yt:hover { color: #FF0000; }
        .social-links a.fb:hover { color: #1877F2; }
        .social-links a.ig:hover { color: #E4405F; }

        /* NAVIGATION */
        nav { background: var(--midnight); padding: 15px; position: sticky; top: 0; z-index: 1000; text-align: center; }
        nav a { color: #cbd5e1; margin: 0 15px; text-decoration: none; font-weight: 600; font-size: 0.85rem; transition: 0.3s; }
        nav a:hover { color: var(--accent); }

        /* GALLERY CONTENT */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--white); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); border: 1px solid #e2e8f0; }
        .card h2 { color: var(--midnight); border-left: 5px solid var(--accent); padding-left: 15px; margin-bottom: 30px; text-transform: uppercase; }
        
        .section-tag { margin: 40px 0 20px 0; font-size: 1.1rem; font-weight: 800; color: var(--midnight); display: flex; align-items: center; gap: 10px; }
        .section-tag i { color: var(--accent); }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .gallery-item { border-radius: 15px; overflow: hidden; border: 4px solid white; box-shadow: var(--shadow); transition: 0.3s; height: 220px; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .gallery-item:hover { transform: translateY(-5px); border-color: var(--accent); }

        footer { text-align: center; padding: 60px; background: var(--midnight); color: #cbd5e1; margin-top: 50px; }
        footer b { color: var(--accent); }
    </style>
</head>
<body>

    
    <header class="super-header">
        <div class="header-left">
            <img src="../assets/people/logo.png" class="logo-img">
            <div class="school-title">
                <h1>MAMTA MODERN SCHOOL</h1>
                <p>Est. 1973 | Golden Jubilee Year</p>
            </div>
        </div>
        <div class="header-right">
            <a href="tel:+911145614501" class="header-info"><i class="fa-solid fa-phone"></i> +91-11-45614501</a>
            <a href="mailto:mamtamodernschool@gmail.com" class="header-info"><i class="fa-solid fa-envelope"></i> mamtamodernschool@gmail.com</a>
            <div class="social-links">
                <a href="https://www.youtube.com/@MamtaModernSchoolVikasPuri" target="_blank" class="yt"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://www.facebook.com/MamtaModernSeniorSecondarySchoolVikasPuri/" target="_blank" class="fb"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://www.instagram.com/mamtamodernschool/" target="_blank" class="ig"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </header>
    <nav>
        <a href="../index.html">HOME</a>
        <a href="gallery.html">GALLERY</a>
        <a href="circulars.html">CIRCULARS</a>
        <a href="suppliers.html">SUPPLIERS</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>School Photo Gallery</h2>

            <div class="section-tag"><i class="fa-solid fa-calendar-check"></i> EVENTS</div>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="../assets/events/award1.jpg" onerror="this.src='https://via.placeholder.com/300'"></div>
                <div class="gallery-item"><img src="../assets/events/award2.jpg" onerror="this.src='https://via.placeholder.com/300'"></div>
            </div>

            <div class="section-tag"><i class="fa-solid fa-school"></i> CAMPUS</div>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="../assets/campus/building.jpg" onerror="this.src='https://via.placeholder.com/300'"></div>
            </div>

            <div class="section-tag"><i class="fa-solid fa-users"></i> PEOPLE</div>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="../assets/people/principal.jpg" onerror="this.src='https://via.placeholder.com/300'"></div>
            </div>
        </div>
    </div>

    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>
</body>
</html>
