<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Mamta Modern</title>
    <style>
        /* COPY-PASTED CSS FROM INDEX FOR CONSISTENCY */
        :root { --midnight: #0a192f; --gold: #c5a059; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f1f5f9; }
        .header-main { background: white; padding: 25px 5%; text-align: center; border-bottom: 4px solid var(--gold); }
        .logo-img { height: 80px; margin-bottom: 10px; }
        nav { background: var(--midnight); padding: 18px; position: sticky; top: 0; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        
        /* GALLERY SPECIFIC */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <header class="header-main">
        <img src="../assets/people/logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/80'">
        <h1 style="color: var(--midnight); font-size: 1.8rem;">MAMTA MODERN SR. SEC. SCHOOL</h1>
    </header>
    <nav>
        <a href="../index.html">HOME</a>
        <a href="gallery.html" style="color: var(--gold);">GALLERY</a>
        <a href="circulars.html">CIRCULARS</a>
        <a href="suppliers.html">SUPPLIERS</a>
    </nav>
    <div class="container">
        <h2 style="margin-bottom: 20px; color: var(--midnight);">School Gallery</h2>
        <div class="gallery-grid">
            <img src="../assets/campus/building.jpg" style="width:100%; border-radius:10px;">
            </div>
    </div>
</body>
</html>
