<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Shared CSS Copy-Pasted for Consistency */
        :root { --midnight: #0f172a; --accent: #d4af37; --white: #ffffff; --soft-bg: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--soft-bg); }
        .main-header { background: var(--white); padding: 15px 6%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); }
        .brand { display: flex; align-items: center; gap: 20px; }
        .brand img { height: 80px; }
        .header-right { text-align: right; }
        .social-links { margin-top: 8px; display: flex; gap: 15px; justify-content: flex-end; }
        .social-links a { font-size: 1.7rem; transition: 0.3s; }
        .fa-youtube { color: #FF0000; }
        .fa-facebook { color: #1877F2; }
        nav { background: var(--midnight); padding: 0 6%; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: center; }
        nav a { color: #f8fafc; padding: 18px 25px; text-decoration: none; font-weight: 600; text-transform: uppercase; }
        
        /* Gallery Styles */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .gallery-card { border-radius: 20px; overflow: hidden; height: 250px; border: 5px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.3s; }
        .gallery-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .gallery-card:hover { transform: scale(1.03); border-color: var(--accent); }
        .gallery-card:hover img { transform: scale(1.1); }
        footer { background: var(--midnight); color: white; padding: 40px 0; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>
    <header class="header-top">
        <div class="header-left">
            <img src="assets/people/logo.png" onerror="this.src='https://via.placeholder.com/100'">
        </div>
        <div class="header-center">
            <h1>MAMTA MODERN SCHOOL</h1>
            <p>NURTURING EXCELLENCE SINCE 1973</p>
        </div>
        <div class="header-right">
            <div class="contact-info">+91-11-45614501</div>
            <div class="contact-info" style="font-size: 0.85rem;">mamtamodernschool@gmail.com</div>
            <div class="social-row">
                <a href="https://www.facebook.com/MamtaModernSeniorSecondarySchoolVikasPuri/" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://www.youtube.com/@MamtaModernSchoolVikasPuri" target="_blank"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://www.instagram.com/mamtamodernschool/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="pages/gallery.html">Gallery</a>
        <a href="pages/circulars.html">Circulars</a>
        <a href="pages/suppliers.html">Suppliers</a>
    </nav>

    <div class="container">
        <h2 style="margin-bottom: 30px; border-left: 5px solid var(--accent); padding-left: 15px;">Event Gallery</h2>
        <div class="gallery-grid" id="grid"></div>
    </div>
    <script>
        const photos = ['campus.jpg', 'sports.jpg', 'award1.jpg', 'award2.jpg', 'award3.jpg', 'award4.jpg', 'award5.jpg'];
        const grid = document.getElementById('grid');
        photos.forEach(p => {
            grid.innerHTML += `<div class="gallery-card"><img src="../assets/events/${p}"></div>`;
        });
    </script>
    <footer><p>© 2026 Mamta Modern School</p></footer>
</body>
</html>
