<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #001f3f; --accent: #d4af37; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial Black', sans-serif; }
        header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; }
        .h-left img { height: 80px; }
        .h-right { text-align: right; }
        .soc-row a { font-size: 1.8rem; margin-left: 10px; }
        .fa-facebook { color: #1877F2; } .fa-youtube { color: #FF0000; }
        nav { background: #001f3f; display: flex; justify-content: center; }
        nav a { color: white; padding: 15px 20px; text-decoration: none; font-size: 0.8rem; text-transform: uppercase; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 40px; }
        .gallery img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <header>
        <div class="h-left"><img src="../assets/people/logo.png"></div>
        <div class="h-right">
            <div style="font-weight:900; color:#001f3f;">+91-11-45614501</div>
            <div style="font-size:0.7rem; color:#666;">mamtamodernschool@gmail.com</div>
            <div class="soc-row">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </header>
    <nav><a href="../index.html">Home</a><a href="gallery.html">Gallery</a><a href="circulars.html">Circulars</a><a href="suppliers.html">Suppliers</a></nav>
    <div class="gallery" id="g"></div>
    <script>
        const imgs = ['campus.jpg', 'sports.jpg', 'award1.jpg', 'award2.jpg', 'award3.jpg', 'award4.jpg', 'award5.jpg'];
        imgs.forEach(m => document.getElementById('g').innerHTML += `<img src="../assets/events/${m}">`);
    </script>
</body>
</html>
