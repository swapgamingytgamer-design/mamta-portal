        /* [Sync CSS from index.html here] */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .gallery-card { border-radius: 15px; overflow: hidden; border: 4px solid white; box-shadow: var(--shadow); transition: 0.3s; }
        .gallery-card img { width: 100%; height: 250px; object-fit: cover; display: block; }
        .gallery-card:hover { transform: scale(1.03); border-color: var(--accent); }
    </style>
</head>
