<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #001f3f; --gold: #d4af37; --white: #ffffff; --silver: #f4f7f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--midnight); }
        .h-left img { height: 90px; }
        .h-right-principal img { height: 85px; width: 70px; border: 2px solid var(--gold); border-radius: 8px; object-fit: cover; }
        nav { background: var(--midnight); display: flex; justify-content: center; position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; padding: 18px 20px; text-decoration: none; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        .gallery-grid { padding: 40px 5%; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; background: white; }
        .gallery-item { height: 300px; background: #000; overflow: hidden; border: 2px solid #eee; position: relative; }
        .gallery-item img { width: 100%; height: 100%; object-fit: contain; transition: 0.5s; }
        .gallery-item:hover img { transform: scale(1.1); }
        .img-cap { position: absolute; bottom: 0; width: 100%; background: rgba(0,31,63,0.8); color: white; padding: 10px; font-size: 0.8rem; text-align: center; }
        footer { background: var(--midnight); color: white; text-align: center; padding: 30px; }
    </style>
</head>
<body>
    <header>
        <div class="h-left"><img src="../assets/people/logo.png"></div>
        <div class="h-right-principal"><img src="../assets/people/principal.jpg"></div>
    </header>
    <nav>
        <a href="../index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="gallery.html" style="color:var(--gold);">Gallery</a>
        <a href="showcase.html">Showcase</a>
    </nav>
    <div class="gallery-grid">
        <div class="gallery-item"><img src="../assets/campus/building.jpg"><div class="img-cap">Our Towering Infrastructure</div></div>
        <div class="gallery-item"><img src="../assets/campus/ground.jpg"><div class="img-cap">7300 Sqm Playground</div></div>
        <div class="gallery-item"><img src="../assets/campus/library.jpg"><div class="img-cap">Library with 18,000+ Books</div></div>
        <div class="gallery-item"><img src="../assets/campus/lawns.jpg"><div class="img-cap">Lush Green Campus Premises</div></div>
    </div>
    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>
</body>
</html>
