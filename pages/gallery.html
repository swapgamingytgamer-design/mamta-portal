<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --midnight: #0f172a; 
            --accent: #d4af37; 
            --white: #ffffff; 
            --soft-bg: #f8fafc;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--soft-bg); color: #334155; }

        /* HEADER - SYNCED RIGHT ALIGNMENT */
        .super-header { 
            background: var(--white); 
            padding: 20px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 4px solid var(--accent);
        }

        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-img { height: 90px; width: auto; }
        .school-title h1 { font-size: 1.8rem; font-weight: 900; color: var(--midnight); margin: 0; }
        .school-title p { font-size: 0.85rem; color: var(--accent); font-weight: 700; text-transform: uppercase; }

        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .contact-row { display: flex; align-items: center; gap: 12px; color: #000; font-weight: 700; font-size: 1.1rem; }
        .gold-icon { color: var(--accent); }
        .social-icon-row { display: flex; gap: 20px; margin-top: 5px; }
        .dark-social { color: var(--midnight); font-size: 1.8rem; text-decoration: none; transition: 0.3s; }
        .dark-social:hover { color: var(--accent); transform: translateY(-3px); }

        /* NAVIGATION */
        nav { 
            background: var(--midnight); 
            padding: 15px; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 2px solid var(--accent);
        }
        nav a { color: #cbd5e1; margin: 0 20px; text-decoration: none; font-weight: 700; font-size: 0.9rem; }
        nav a:hover { color: var(--accent); }

        /* GALLERY GRID STYLING */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--white); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); border: 1px solid #e2e8f0; }
        .card h2 { color: var(--midnight); border-left: 5px solid var(--accent); padding-left: 15px; margin-bottom: 30px; }

        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
        }

        .gallery-item { 
            position: relative; 
            border-radius: 20px; 
            overflow: hidden; 
            height: 260px; 
            border: 5px solid #fff; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.08); 
            transition: 0.4s ease; 
        }

        .gallery-item img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: 0.6s; 
        }

        /* HOVER EFFECTS */
        .gallery-item:hover { 
            transform: translateY(-10px); 
            border-color: var(--accent); 
            box-shadow: var(--shadow);
        }
        .gallery-item:hover img { transform: scale(1.15); }

        /* IMAGE OVERLAY TITLE */
        .img-overlay { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.9)); 
            padding: 20px; 
            color: #fff; 
            opacity: 0; 
            transition: 0.3s; 
        }
        .gallery-item:hover .img-overlay { opacity: 1; }

        footer { text-align: center; padding: 60px; background: var(--midnight); color: #cbd5e1; margin-top: 50px; }
        footer b { color: var(--accent); }

        @media (max-width: 900px) {
            .super-header { flex-direction: column; text-align: center; }
            .header-right { align-items: center; margin-top: 15px; }
        }
    </style>
</head>
<body>

    <header class="super-header">
        <div class="header-left">
            <img src="../assets/people/logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/90'">
            <div class="school-title">
                <h1>MAMTA MODERN SCHOOL</h1>
                <p>EST. 1973 | GOLDEN JUBILEE YEAR</p>
            </div>
        </div>
        <div class="header-right">
            <div class="contact-row"><i class="fa-solid fa-phone gold-icon"></i> <span>+91-11-45614501</span></div>
            <div class="contact-row"><i class="fa-solid fa-envelope gold-icon"></i> <span>mamtamodernschool@gmail.com</span></div>
            <div class="social-icon-row">
                <a href="#" class="dark-social"><i class="fa-brands fa-square-youtube"></i></a>
                <a href="#" class="dark-social"><i class="fa-brands fa-circle-facebook"></i></a>
                <a href="#" class="dark-social"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </header>

    <nav>
        <a href="../index.html">HOME</a>
        <a href="gallery.html">GALLERY</a>
        <a href="circulars.html">CIRCULARS</a>
        <a href="suppliers.html">SUPPLIERS</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>School Gallery</h2>
            <div class="gallery-grid" id="galleryGrid">
                </div>
        </div>
    </div>

    <script>
        // Simply add your photos from the assets/events folder here
        const galleryImages = [
            { src: '../assets/events/building.jpg', title: 'Our Campus' },
            { src: '../assets/events/sports.jpg', title: 'Sports Meet' },
            { src: '../assets/events/lab.jpg', title: 'Science Lab' },
            { src: '../assets/events/award.jpg', title: 'Annual Awards' },
            { src: '../assets/events/cultural.jpg', title: 'Cultural Program' },
            { src: '../assets/events/yoga.jpg', title: 'Yoga Session' }
        ];

        const grid = document.getElementById('galleryGrid');

        galleryImages.forEach(img => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <img src="${img.src}" onerror="this.src='https://via.placeholder.com/400x300?text=Event+Photo'">
                <div class="img-overlay">
                    <p style="font-weight:700;">${img.title}</p>
                </div>
            `;
            grid.appendChild(item);
        });
    </script>

    <footer>
        <p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p>
    </footer>

</body>
</html>
