<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Suppliers | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #001f3f; --accent: #d4af37; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .box { background: white; padding: 30px; border-radius: 15px; border: 1px solid #ddd; text-align: center; }
        .box h3 { color: var(--midnight); margin: 10px 0; }
        .call-btn { display: inline-block; background: var(--midnight); color: var(--accent); padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"><h3>Design X Knitwears</h3><p>Uniform Supplier</p><a href="tel:01145614501" class="call-btn">Call Now</a></div>
        <div class="box"><h3>Shilpi Prakashan</h3><p>Books & Stationery</p><a href="tel:01145614501" class="call-btn">Call Now</a></div>
    </div>
</body>
</html>
