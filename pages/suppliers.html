<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Suppliers | Mamta Modern</title>
    <style>
        :root { --midnight: #0a192f; --gold: #c5a059; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f1f5f9; color: #333; }

        nav { background: var(--midnight); padding: 15px; text-align: center; position: sticky; top: 0; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; font-size: 0.85rem; }
        nav a:hover { color: var(--gold); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--midnight); }
        .header p { color: var(--gold); font-weight: bold; }

        /* SUPPLIER TABLE */
        .supplier-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8fafc; text-align: left; padding: 15px; color: var(--midnight); border-bottom: 2px solid #e2e8f0; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; vertical-align: top; }
        
        .vendor-name { font-weight: bold; color: var(--midnight); display: block; margin-bottom: 4px; }
        .gst { font-size: 0.75rem; color: #64748b; font-family: monospace; }
        
        .call-btn { 
            display: inline-block; background: #22c55e; color: white; 
            padding: 8px 12px; border-radius: 5px; text-decoration: none; 
            font-size: 0.8rem; font-weight: bold; transition: 0.3s;
        }
        .call-btn:hover { background: #16a34a; transform: scale(1.05); }

        footer { background: var(--midnight); color: #64748b; text-align: center; padding: 30px; margin-top: 50px; }
    </style>
</head>
<body>

    <nav>
        <a href="../index.html">HOME</a>
        <a href="gallery.html">GALLERY</a>
        <a href="circulars.html">CIRCULARS</a>
        <a href="dress.html">SCHOOL DRESS</a>
        <a href="suppliers.html" style="color: var(--gold);">SUPPLIERS</a>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Authorized Vendors</h1>
            <p>Books, Uniform & Stationery Suppliers</p>
        </div>

        <div class="supplier-card">
            <table>
                <thead>
                    <tr>
                        <th>Vendor Details</th>
                        <th>Address</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="supplier-list">
                    </tbody>
            </table>
        </div>
        
        <div style="margin-top: 20px; background: #e0f2fe; padding: 15px; border-radius: 8px; border: 1px solid #bae6fd;">
            <p style="font-size: 0.85rem; color: #0369a1;"><b>Note:</b> Please find the detailed Book List attached in the Circulars section.</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Mamta Modern School</p>
    </footer>

    <script>
        const vendors = [
            { 
                name: "DESIGN X KNITWEARS", 
                gst: "07ACVPM5786A1Z5", 
                addr: "A-42/3 Mayapuri Indl Area, Phase-1, New Delhi-64", 
                phone: "07947143622" 
            },
            { 
                name: "UNIFORM SELECTION", 
                gst: "", 
                addr: "Hari Nagar, New Delhi-110064", 
                phone: "07947110334" 
            },
            { 
                name: "AHUJA GARMENTS", 
                gst: "", 
                addr: "Vikas Puri, New Delhi-110018", 
                phone: "07947108633" 
            },
            { 
                name: "SHILPI PRAKASHAN", 
                gst: "", 
                addr: "Vikaspuri, New Delhi-110018", 
                phone: "9350520688" 
            },
            { 
                name: "HELLO BOOK DEPOT", 
                gst: "", 
                addr: "Vikaspuri, New Delhi-110018", 
                phone: "0794751173" 
            }
        ];

        document.getElementById('supplier-list').innerHTML = vendors.map(v => `
            <tr>
                <td>
                    <span class="vendor-name">${v.name}</span>
                    ${v.gst ? `<span class="gst">GST: ${v.gst}</span>` : ''}
                </td>
                <td>${v.addr}</td>
                <td>
                    <a href="tel:${v.phone.replace(/\s/g, '')}" class="call-btn">📞 Call</a>
                </td>
            </tr>
        `).join('');
    </script>
</body>
</html>
