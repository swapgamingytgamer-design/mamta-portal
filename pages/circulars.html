<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circulars | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #001f3f; --accent: #d4af37; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial Black', sans-serif; }
        body { background: #f4f7f6; color: #333; }

        /* UNIFIED HEADER */
        header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; }
        .h-left img { height: 100px; }
        .h-center { flex-grow: 1; padding-left: 30px; }
        .h-center h1 { color: #001f3f; font-size: 2.3rem; margin: 0; line-height: 1; text-align: left; }
        .h-center p { color: var(--accent); font-size: 0.9rem; font-weight: bold; margin-top: 8px; text-align: left; }
        .h-right { text-align: right; display: flex; flex-direction: column; gap: 6px; min-width: 300px; }
        .info-txt { font-weight: 900; color: #001f3f; font-size: 1.1rem; font-family: 'Arial', sans-serif; display: flex; justify-content: flex-end; align-items: center; }
        .info-txt a { text-decoration: none; color: inherit; }
        .info-txt i { color: var(--midnight); margin-right: 10px; font-size: 1.2rem; }
        .soc-row { display: flex; justify-content: flex-end; gap: 15px; margin-top: 5px; }
        .soc-row a { font-size: 1.9rem; text-decoration: none; }
        .fa-facebook { color: #1877F2; } .fa-youtube { color: #FF0000; } .fa-instagram { color: #E4405F; }

        /* NAV */
        nav { background: #001f3f; padding: 0 5%; display: flex; justify-content: center; position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; padding: 18px 25px; text-decoration: none; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
        nav a:hover { color: var(--accent); background: rgba(255,255,255,0.1); }

        /* CIRCULAR LIST */
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .item { background: white; padding: 25px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-left: 8px solid var(--midnight); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .item-info b { font-size: 1.1rem; color: var(--midnight); }
        .item-info small { color: #666; font-family: 'Arial', sans-serif; }
        .btn { background: var(--midnight); color: var(--accent); padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; border: 2px solid var(--accent); font-size: 0.8rem; }

        footer { background: #001f3f; color: white; padding: 40px; text-align: center; margin-top: 50px; }
        footer b { color: var(--accent); }

        @media (max-width: 900px) { header { flex-direction: column; text-align: center; } .h-center { padding: 15px 0; } .h-right { text-align: center; } .soc-row, .info-txt { justify-content: center; } .item { flex-direction: column; text-align: center; gap: 15px; } }
    </style>
</head>
<body>
    <header>
        <div class="h-left"><img src="../assets/people/logo.png"></div>
        <div class="h-center"><h1>MAMTA MODERN SCHOOL</h1><p>NURTURING EXCELLENCE SINCE 1973</p></div>
        <div class="h-right">
            <div class="info-txt"><a href="tel:+911145614501"><i class="fa-solid fa-phone"></i>+91-11-45614501</a></div>
            <div class="info-txt" style="font-size: 0.85rem;"><a href="mailto:mamtamodernschool@gmail.com"><i class="fa-solid fa-envelope"></i>mamtamodernschool@gmail.com</a></div>
            <div class="soc-row">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </header>
    <nav>
        <a href="../index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="circulars.html">Circulars</a>
        <a href="suppliers.html">Suppliers</a>
        <a href="policies.html">Policies</a>
    </nav>

    <div class="container" id="list">
        <h2 style="margin-bottom: 30px; color: var(--midnight); border-left: 8px solid var(--accent); padding-left: 15px;">Latest Circulars</h2>
        </div>

    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>

    <script>
        // Add your circulars here
        const data = [
            {t: "Summer Vacation Schedule 2026", d: "May 15, 2026", f: "summer_break.pdf"},
            {t: "Uniform Change Notice", d: "April 10, 2026", f: "uniform.pdf"}
        ];
        const l = document.getElementById('list');
        if(data.length === 0) {
            l.innerHTML += "<p style='text-align:center; padding: 50px;'>No circulars posted yet.</p>";
        } else {
            data.forEach(c => {
                l.innerHTML += `
                <div class="item">
                    <div class="item-info">
                        <b>${c.t}</b><br>
                        <small>Posted on: ${c.d}</small>
                    </div>
                    <a href="../assets/circulars/${c.f}" class="btn">VIEW PDF</a>
                </div>`;
            });
        }
    </script>
</body>
</html>
