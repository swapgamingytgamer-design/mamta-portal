<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Circulars | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Shared Styles */
        :root { --midnight: #0f172a; --accent: #d4af37; --white: #ffffff; --soft-bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--soft-bg); }
        .super-header { background: var(--white); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); }
        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .social-icon-row { display: flex; gap: 20px; margin-top: 5px; }
        .dark-social { color: var(--midnight); font-size: 1.8rem; text-decoration: none; }
        nav { background: var(--midnight); padding: 15px; text-align: center; border-bottom: 2px solid var(--accent); }
        nav a { color: #cbd5e1; margin: 0 20px; text-decoration: none; font-weight: 700; }
        
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--white); padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .circular-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #f1f5f9; }
        .btn-download { background: var(--midnight); color: var(--accent); padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: 800; border: 2px solid var(--accent); }
        footer { text-align: center; padding: 50px; background: var(--midnight); color: #cbd5e1; }
    </style>
</head>
<body>
    <header class="super-header">
        <div class="header-left">
            <img src="../assets/people/logo.png" height="90">
            <div class="school-title"><h1>MAMTA MODERN SCHOOL</h1><p>EST. 1973</p></div>
        </div>
        <div class="header-right">
            <div class="social-icon-row">
                <a href="https://www.youtube.com/@MamtaModernSchoolVikasPuri" target="_blank" class="dark-social"><i class="fa-brands fa-square-youtube"></i></a>
                <a href="https://www.facebook.com/MamtaModernSeniorSecondarySchoolVikasPuri/" target="_blank" class="dark-social"><i class="fa-brands fa-circle-facebook"></i></a>
            </div>
        </div>
    </header>
    <nav>
        <a href="../index.html">HOME</a>
        <a href="gallery.html">GALLERY</a>
        <a href="circulars.html">CIRCULARS</a>
        <a href="suppliers.html">SUPPLIERS</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Official Circulars</h2>
            <div id="circularList"></div>
        </div>
    </div>

    <script>
        // Set this to [] to see the "No circulars" message
        const circularData = [
            { date: "May 15, 2026", title: "Summer Assignments", file: "work.pdf" }
        ];

        const list = document.getElementById('circularList');
        if (circularData.length === 0) {
            list.innerHTML = `<div style="text-align:center; padding: 40px; color: #64748b;">No circulars available at the moment.</div>`;
        } else {
            circularData.forEach(item => {
                list.innerHTML += `
                    <div class="circular-item">
                        <div><p style="color:var(--accent); font-weight:800;">${item.date}</p><h3>${item.title}</h3></div>
                        <a href="../assets/circulars/${item.file}" class="btn-download">DOWNLOAD</a>
                    </div>`;
            });
        }
    </script>
    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>
</body>
</html>
