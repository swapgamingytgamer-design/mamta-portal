<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circulars | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #0f172a; --accent: #d4af37; --soft-bg: #f8fafc; --white: #ffffff; --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--soft-bg); color: #334155; }

        /* HEADER SYNC */
        .super-header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-img { height: 85px; }
        .school-title h1 { font-size: 1.6rem; font-weight: 800; color: var(--midnight); }
        .school-title p { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; }

        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .contact-row { display: flex; align-items: center; gap: 10px; }
        .gold-icon { color: var(--accent); font-size: 1rem; width: 20px; text-align: center; }
        .contact-text { text-decoration: none; color: #000; font-weight: 700; font-size: 1rem; }
        .social-icon-row { display: flex; gap: 18px; margin-top: 8px; padding-right: 15px; }
        .dark-social { color: var(--midnight); font-size: 1.8rem; text-decoration: none; transition: 0.3s; }

        nav { background: var(--midnight); padding: 15px; text-align: center; }
        nav a { color: #cbd5e1; margin: 0 15px; text-decoration: none; font-weight: 600; font-size: 0.85rem; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--white); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); border: 1px solid #e2e8f0; }
        .circular-row { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #f1f5f9; transition: 0.3s; }
        .circular-row:hover { background: #fffdf5; transform: translateX(10px); }
        .c-date { font-size: 0.8rem; color: var(--accent); font-weight: 800; }
        .btn-download { background: var(--midnight); color: var(--accent); padding: 8px 18px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border: 2px solid var(--accent); }

        footer { text-align: center; padding: 60px; background: var(--midnight); color: #cbd5e1; margin-top: 50px; }
    </style>
</head>
<body>
    <header class="super-header">
        <div class="header-left">
            <img src="../assets/people/logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/85'">
            <div class="school-title"><h1>MAMTA MODERN SCHOOL</h1><p>Est. 1973 | Golden Jubilee Year</p></div>
        </div>
        <div class="header-right">
            <div class="contact-row"><i class="fa-solid fa-phone gold-icon"></i><a href="tel:+911145614501" class="contact-text">+91-11-45614501</a></div>
            <div class="contact-row"><i class="fa-solid fa-envelope gold-icon"></i><a href="mailto:mamtamodernschool@gmail.com" class="contact-text">mamtamodernschool@gmail.com</a></div>
            <div class="social-icon-row">
                <a href="#" class="dark-social"><i class="fa-brands fa-square-youtube"></i></a>
                <a href="#" class="dark-social"><i class="fa-brands fa-circle-facebook"></i></a>
                <a href="#" class="dark-social"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </header>
    <nav><a href="../index.html">HOME</a><a href="gallery.html">GALLERY</a><a href="circulars.html">CIRCULARS</a></nav>
    <div class="container">
        <div class="card">
            <h2>Official Circulars</h2>
            <div id="circular-container"></div>
        </div>
    </div>
    <script>
        const circulars = [
            { date: "May 15, 2026", title: "Summer Vacation Homework", file: "summer_homework.pdf" },
            { date: "May 10, 2026", title: "PTM Notice", file: "ptm_notice.pdf" }
        ];
        const container = document.getElementById('circular-container');
        circulars.forEach(item => {
            container.innerHTML += `
                <div class="circular-row">
                    <div><p class="c-date">${item.date}</p><h3>${item.title}</h3></div>
                    <a href="../assets/circulars/${item.file}" target="_blank" class="btn-download">DOWNLOAD</a>
                </div>`;
        });
    </script>
    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>
</body>
</html>
