<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circulars | Mamta Modern School</title>
    <style>
        :root { --midnight: #0f172a; --accent: #d4af37; --soft-bg: #f8fafc; --white: #ffffff; --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--soft-bg); color: #334155; }

        /* SHARED HEADER */
        .super-header { background: var(--white); padding: 20px 5%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); gap: 20px; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-img { height: 85px; }
        .school-title h1 { font-size: 1.6rem; font-weight: 800; color: var(--midnight); }
        .header-right { text-align: right; min-width: 250px; }
        .header-info { display: block; font-size: 0.85rem; font-weight: 600; text-decoration: none; color: var(--midnight); margin-bottom: 4px; }

        /* SHARED NAV */
        nav { background: var(--midnight); padding: 15px; position: sticky; top: 0; z-index: 1000; text-align: center; }
        nav a { color: #cbd5e1; margin: 0 15px; text-decoration: none; font-weight: 600; font-size: 0.85rem; }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; min-height: 50vh; }
        .circular-box { background: var(--white); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
        .circular-item { display: flex; justify-content: space-between; padding: 20px; border-bottom: 1px solid #f1f5f9; text-decoration: none; color: inherit; transition: 0.2s; }
        .circular-item:hover { background: #fffbeb; }

        .empty-state { text-align: center; padding: 60px; color: #94a3b8; display: none; }
        footer { text-align: center; padding: 50px; color: #94a3b8; }
    </style>
</head>
<body>

    <header class="super-header">
        <div class="header-left">
            <img src="../assets/people/logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/85'">
            <div class="school-title">
                <h1>MAMTA MODERN SCHOOL</h1>
                <p>Est. 1973 | Golden Jubilee Year</p>
            </div>
        </div>
        <div class="header-right">
            <a href="tel:+911145614501" class="header-info"><b>📞</b> +91-11-45614501</a>
            <a href="mailto:mamtamodernschool@gmail.com" class="header-info"><b>📧</b> mamtamodernschool@gmail.com</a>
        </div>
    </header>

    <nav>
        <a href="../index.html">HOME</a>
        <a href="gallery.html">GALLERY</a>
        <a href="circulars.html">CIRCULARS</a>
        <a href="suppliers.html">SUPPLIERS</a>
    </nav>

    <div class="container">
        <h2 style="text-align: center; margin-bottom: 30px;">School Circulars</h2>
        <div class="circular-box" id="circularList">
            </div>
        <div id="noCirculars" class="empty-state">
            <p>📭 No active circulars at this time.</p>
        </div>
    </div>

    <footer>© 2026 Mamta Modern Sr. Sec. School | Golden Jubilee Year</footer>

    <script>
        const list = document.getElementById('circularList');
        const empty = document.getElementById('noCirculars');
        if (list.children.length === 0) {
            list.style.display = 'none';
            empty.style.display = 'block';
        }
    </script>
</body>
</html>
