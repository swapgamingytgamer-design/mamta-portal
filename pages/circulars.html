<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Circulars | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #001f3f; --accent: #d4af37; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        /* Use same header/nav styles as gallery above */
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .item { background: white; padding: 20px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid var(--midnight); }
        .btn { background: var(--midnight); color: var(--accent); padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container" id="l"><h2>Official Circulars</h2></div>
    <script>
        const docs = [{ t: "School Reopening Notice", d: "May 20, 2026", f: "notice.pdf" }];
        const l = document.getElementById('l');
        if(docs.length === 0) l.innerHTML += "<p>No circulars available.</p>";
        else docs.forEach(d => l.innerHTML += `<div class="item"><div><b>${d.t}</b><br><small>${d.d}</small></div><a href="../assets/circulars/${d.f}" class="btn">VIEW</a></div>`);
    </script>
</body>
</html>
