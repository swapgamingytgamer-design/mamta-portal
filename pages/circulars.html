<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Circulars | Mamta Modern</title>
    <style>
        :root { --midnight: #0a192f; --gold: #c5a059; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
        nav { background: var(--midnight); padding: 15px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        .list { max-width: 700px; margin: 50px auto; }
        .item { display: block; background: white; padding: 20px; margin-bottom: 10px; border-left: 5px solid var(--gold); text-decoration: none; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html">HOME</a>
        <a href="circulars.html" style="color:var(--gold)">CIRCULARS</a>
    </nav>
    <div class="list" id="c-list"></div>
    <script>
        const files = ["Final_Term_Datesheet.pdf", "Book_List_2026.pdf", "Uniform_Rules.pdf"];
        document.getElementById('c-list').innerHTML = files.map(f => `
            <a href="../circulars/${f}" class="item" target="_blank">📄 ${f.replace(/_/g,' ')}</a>
        `).join('');
    </script>
</body>
</html>
