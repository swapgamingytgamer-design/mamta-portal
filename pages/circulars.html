<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circulars | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #0f172a; --accent: #d4af37; --white: #ffffff; --soft-bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--soft-bg); color: #334155; }

        /* HEADER & NAV SYNCED */
        .super-header { background: var(--white); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-img { height: 90px; }
        .school-title h1 { font-size: 1.8rem; font-weight: 900; color: var(--midnight); margin: 0; }
        .school-title p { font-size: 0.85rem; color: var(--accent); font-weight: 700; text-transform: uppercase; }

        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .contact-row { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.1rem; color: #000; }
        .social-icon-row { display: flex; gap: 20px; margin-top: 5px; }
        .dark-social { color: var(--midnight); font-size: 1.8rem; text-decoration: none; transition: 0.3s; }
        
        nav { background: var(--midnight); padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--accent); }
        nav a { color: #cbd5e1; margin: 0 20px; text-decoration: none; font-weight: 700; font-size: 0.9rem; }
        nav a:hover { color: var(--accent); }

        /* CIRCULAR ITEMS */
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--white); padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .card h2 { color: var(--midnight); border-left: 5px solid var(--accent); padding-left: 15px; margin-bottom: 30px; }

        .circular-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px; 
            background: #fff; 
            border-bottom: 1px solid #f1f5f9; 
            transition: 0.3s;
        }
        .circular-item:hover { background: #fffcf0; }
        .c-info h3 { font-size: 1.1rem; color: var(--midnight); }
        .c-date { font-size: 0.85rem; color: var(--accent); font-weight: 800; margin-bottom: 5px; }

        .btn-download { 
            background: var(--midnight); 
            color: var(--accent); 
            text-decoration: none; 
            padding: 10px 20px; 
            border-radius: 50px; 
            font-weight: 800; 
            font-size: 0.8rem; 
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-download:hover { background: var(--accent); color: var(--midnight); }

        footer { text-align: center; padding: 60px; background: var(--midnight); color: #cbd5e1; }
    </style>
</head>
<body>

    <header class="super-header">
        <div class="header-left">
            <img src="../assets/people/logo.png" class="logo-img">
            <div class="school-title"><h1>MAMTA MODERN SCHOOL</h1><p>EST. 1973</p></div>
        </div>
        <div class="header-right">
            <div class="contact-row"><span>+91-11-45614501</span></div>
            <div class="social-icon-row">
                <a href="https://www.youtube.com/@MamtaModernSchoolVikasPuri" target="_blank" class="dark-social"><i class="fa-brands fa-square-youtube"></i></a>
                <a href="https://www.facebook.com/MamtaModernSeniorSecondarySchoolVikasPuri/" target="_blank" class="dark-social"><i class="fa-brands fa-circle-facebook"></i></a>
            </div>
        </div>
    </header>

    <nav>
        <a href="../index.html">HOME</a>
        <a href="gallery.html">GALLERY</a>
        <a href="circulars.html">CIRCULARS</a>
        <a href="suppliers.html">SUPPLIERS</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>School Circulars</h2>
            <div id="circularList"></div>
        </div>
    </div>

    <script>
        // Set this array to [] to test the "Empty" message
        const circularData = [
            { date: "May 15, 2026", title: "Summer Vacation Assignments 2026-27", file: "summer.pdf" },
            { date: "May 10, 2026", title: "PTM Schedule for Class 1-12", file: "ptm.pdf" }
        ];

        const list = document.getElementById('circularList');

        if (circularData.length === 0) {
            list.innerHTML = `
                <div style="text-align:center; padding: 50px; opacity: 0.6;">
                    <i class="fa-solid fa-file-circle-xmark" style="font-size: 3rem; color: #64748b; margin-bottom: 15px;"></i>
                    <p style="font-weight: 700;">No circulars available at the moment.</p>
                </div>`;
        } else {
            circularData.forEach(item => {
                list.innerHTML += `
                    <div class="circular-item">
                        <div class="c-info">
                            <p class="c-date">${item.date}</p>
                            <h3>${item.title}</h3>
                        </div>
                        <a href="../assets/circulars/${item.file}" target="_blank" class="btn-download">
                            <i class="fa-solid fa-file-pdf"></i> DOWNLOAD
                        </a>
                    </div>`;
            });
        }
    </script>

    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>
</body>
</html>
