<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circulars | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
    :root { 
        --midnight: #0f172a; 
        --accent: #d4af37; 
        --white: #ffffff; 
    }

    /* Main Header Container */
    .super-header { 
        background: var(--white); 
        padding: 20px 5%; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        border-bottom: 4px solid var(--accent);
    }

    /* Left Side: Logo and Title */
    .header-left { 
        display: flex; 
        align-items: center; 
        gap: 20px; 
    }
    .logo-img { height: 90px; width: auto; }
    .school-title h1 { 
        font-size: 1.8rem; 
        font-weight: 900; 
        color: var(--midnight); 
        margin: 0;
        letter-spacing: 1px;
    }
    .school-title p { 
        font-size: 0.85rem; 
        color: var(--accent); 
        font-weight: 700; 
        text-transform: uppercase; 
        margin-top: 5px;
    }

    /* Right Side: Stacked Contact Info (Matches your images) */
    .header-right { 
        display: flex;
        flex-direction: column;
        align-items: flex-end; /* Aligns all rows to the right edge */
        gap: 8px;
    }

    .contact-row {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
    }

    .gold-icon {
        color: var(--accent);
        font-size: 1.1rem;
    }

    .contact-text {
        color: #000000;
        font-weight: 700;
        font-size: 1.1rem;
        text-decoration: none;
    }

    /* Social Icons Row */
    .social-icon-row {
        display: flex;
        gap: 20px;
        margin-top: 5px;
    }

    .dark-social {
        color: var(--midnight);
        font-size: 1.8rem;
        text-decoration: none;
        transition: transform 0.3s ease;
    }

    .dark-social:hover {
        color: var(--accent);
        transform: translateY(-3px);
    }

    /* Mobile View */
    @media (max-width: 900px) {
        .super-header { flex-direction: column; text-align: center; gap: 20px; }
        .header-right { align-items: center; }
    }
</style>
</head>
<body>
    <header class="super-header">
    <div class="header-left">
        <img src="assets/people/logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/90'">
        <div class="school-title">
            <h1>MAMTA MODERN SCHOOL</h1>
            <p>EST. 1973 | GOLDEN JUBILEE YEAR</p>
        </div>
    </div>

    <div class="header-right">
        <div class="contact-row">
            <i class="fa-solid fa-phone gold-icon"></i>
            <span class="contact-text">+91-11-45614501</span>
        </div>
        
        <div class="contact-row">
            <i class="fa-solid fa-envelope gold-icon"></i>
            <span class="contact-text">mamtamodernschool@gmail.com</span>
        </div>
        
        <div class="social-icon-row">
            <a href="https://www.youtube.com/@MamtaModernSchoolVikasPuri" target="_blank" class="dark-social">
                <i class="fa-brands fa-square-youtube"></i>
            </a>
            <a href="https://www.facebook.com/MamtaModernSeniorSecondarySchoolVikasPuri/" target="_blank" class="dark-social">
                <i class="fa-brands fa-circle-facebook"></i>
            </a>
            <a href="https://www.instagram.com/mamtamodernschool/" target="_blank" class="dark-social">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
    </div>
</header>
    <nav><a href="../index.html">HOME</a><a href="gallery.html">GALLERY</a><a href="circulars.html">CIRCULARS</a></nav>
    <div class="container">
        <div class="card">
            <h2>Official Circulars</h2>
            <div id="circular-container"></div>
        </div>
    </div>
    <script>
        const circulars = [
            { date: "May 15, 2026", title: "Summer Vacation Homework", file: "summer_homework.pdf" },
            { date: "May 10, 2026", title: "PTM Notice", file: "ptm_notice.pdf" }
        ];
        const container = document.getElementById('circular-container');
        circulars.forEach(item => {
            container.innerHTML += `
                <div class="circular-row">
                    <div><p class="c-date">${item.date}</p><h3>${item.title}</h3></div>
                    <a href="../assets/circulars/${item.file}" target="_blank" class="btn-download">DOWNLOAD</a>
                </div>`;
        });
    </script>
    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>
</body>
</html>
