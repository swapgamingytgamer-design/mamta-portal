<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circulars | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #001f3f; --gold: #d4af37; --white: #ffffff; --silver: #f4f7f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--midnight); }
        .h-left img { height: 90px; }
        .h-right-principal img { height: 85px; width: 70px; border: 2px solid var(--gold); border-radius: 8px; object-fit: cover; }
        nav { background: var(--midnight); display: flex; justify-content: center; position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; padding: 18px 20px; text-decoration: none; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        
        .content { padding: 60px 10%; background: white; }
        .circular-list { border-collapse: collapse; width: 100%; margin-top: 30px; }
        .circular-list th, .circular-list td { border: 1px solid #ddd; padding: 15px; text-align: left; }
        .circular-list th { background: var(--midnight); color: white; }
        .download-btn { color: var(--midnight); font-weight: bold; text-decoration: none; }
        .download-btn i { color: var(--gold); margin-right: 5px; }
        
        footer { background: var(--midnight); color: white; text-align: center; padding: 30px; }
    </style>
</head>
<body>
    <header>
        <div class="h-left"><img src="../assets/people/logo.png"></div>
        <div class="h-right-principal"><img src="../assets/people/principal.jpg"></div>
    </header>
    <nav>
        <a href="../index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="gallery.html">Gallery</a>
        <a href="circulars.html" style="color:var(--gold);">Circulars</a>
        <a href="admission.html">Admissions</a>
        <a href="showcase.html">Showcase</a>
        <a href="complaints.html">Complaints</a>
    </nav>

    <div class="content">
        <h2>Latest Notices & Circulars</h2>
        <table class="circular-list">
            <tr>
                <th>Date</th>
                <th>Subject</th>
                <th>Download</th>
            </tr>
            <tr>
                <td>May 15, 2026</td>
                <td>Self-Transport Guidelines No. 002/2026</td>
                <td><a href="../assets/circulars/002.pdf" class="download-btn"><i class="fa-solid fa-file-pdf"></i> Download</a></td>

    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>
</body>
</html>
