<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #0f172a; --accent: #d4af37; --soft-bg: #f8fafc; --white: #ffffff; --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--soft-bg); color: #334155; line-height: 1.6; }

        /* SYNCED HEADER */
        .super-header { background: var(--white); padding: 20px 5%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); gap: 20px; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-img { height: 85px; width: auto; }
        .school-title h1 { font-size: 1.6rem; font-weight: 800; color: var(--midnight); }
        .school-title p { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; }
        .header-right { text-align: right; min-width: 250px; }
        .header-info { display: block; font-size: 0.85rem; font-weight: 600; text-decoration: none; color: var(--midnight); margin-bottom: 6px; }
        .header-info i { color: var(--accent); margin-right: 10px; width: 20px; text-align: center; }
        
        /* SOCIAL LINKS WITH INSTAGRAM */
        .social-links { margin-top: 12px; display: flex; gap: 18px; justify-content: flex-end; }
        .social-links a { text-decoration: none; font-size: 1.4rem; color: var(--midnight); transition: 0.3s; }
        .social-links a.yt:hover { color: #FF0000; }
        .social-links a.fb:hover { color: #1877F2; }
        .social-links a.ig:hover { color: #E4405F; }

        /* NAVIGATION */
        nav { background: var(--midnight); padding: 15px; position: sticky; top: 0; z-index: 1000; text-align: center; }
        nav a { color: #cbd5e1; margin: 0 15px; text-decoration: none; font-weight: 600; font-size: 0.85rem; transition: 0.3s; }
        nav a:hover { color: var(--accent); }

        /* CONTENT */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--white); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); border: 1px solid #e2e8f0; min-height: 450px; }
        .card h2 { color: var(--midnight); border-left: 5px solid var(--accent); padding-left: 15px; margin-bottom: 30px; }

        /* CIRCULAR LIST STYLE */
        #circular-container { display: flex; flex-direction: column; gap: 15px; }
        .circular-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 22px; background: #fff; border: 1px solid #f1f5f9; 
            border-radius: 18px; transition: 0.3s ease;
        }
        .circular-row:hover { transform: translateX(10px); border-color: var(--accent); background: #fffdf5; }
        .c-info h3 { font-size: 1.1rem; color: var(--midnight); margin-bottom: 5px; }
        .c-date { font-size: 0.8rem; color: var(--accent); font-weight: 800; text-transform: uppercase; }

        .btn-download { 
            background: var(--midnight); color: var(--accent); padding: 10px 22px; 
            border-radius: 50px; text-decoration: none; font-weight: 700; 
            border: 2px solid var(--accent); font-size: 0.85rem; transition: 0.3s;
            white-space: nowrap;
        }
        .btn-download:hover { background: var(--accent); color: var(--midnight); }

        .status-msg { text-align: center; color: #94a3b8; font-style: italic; padding: 30px; }

        footer { text-align: center; padding: 60px; background: var(--midnight); color: #cbd5e1; margin-top: 50px; }
        footer b { color: var(--accent); }

        @media (max-width: 700px) {
            .circular-row { flex-direction: column; text-align: center; gap: 15px; }
        }
    </style>
</head>
<body>

</div>

    <div class="container">
        <div class="card">
            <h2>Official Circulars & Notices</h2>
            <div id="circular-container">
                <div class="status-msg">Loading circulars...</div>
            </div>
        </div>
    </div>

    <script>
        /**
         * ADD NEW CIRCULARS HERE
         * Make sure the 'file' name matches the PDF in your /assets/circulars/ folder.
         */
        const circularsList = [
            { date: "May 15, 2026", title: "Summer Vacation Homework - 2026", file: "summer_homework_2026.pdf" },
            { date: "May 12, 2026", title: "PTM Schedule & Timing (Classes VI-XII)", file: "ptm_schedule.pdf" },
            { date: "May 05, 2026", title: "Annual Sports Day Participation Form", file: "sports_participation.pdf" }
        ];

        const container = document.getElementById('circular-container');

        async function updateList() {
            container.innerHTML = '';
            let activeCount = 0;

            for (const item of circularsList) {
                const path = `../assets/circulars/${item.file}`;
                
                try {
                    // Verifies the file actually exists before showing it
                    const response = await fetch(path, { method: 'HEAD' });
                    
                    if (response.ok) {
                        container.innerHTML += `
                            <div class="circular-row">
                                <div class="c-info">
                                    <p class="c-date">${item.date}</p>
                                    <h3>${item.title}</h3>
                                </div>
                                <a href="${path}" target="_blank" class="btn-download">
                                    <i class="fa-solid fa-file-pdf"></i> DOWNLOAD
                                </a>
                            </div>
                        `;
                        activeCount++;
                    }
                } catch (err) { console.warn("Circular missing:", item.file); }
            }

            if (activeCount === 0) {
                container.innerHTML = '<div class="status-msg">No active circulars found in the folder.</div>';
            }
        }

        window.onload = updateList;
    </script>
