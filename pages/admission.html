<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admissions | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #001f3f; --gold: #d4af37; --white: #ffffff; --silver: #f4f7f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--midnight); }
        .h-left img { height: 90px; }
        .h-right-principal { display: flex; align-items: center; gap: 12px; }
        .h-right-principal img { height: 85px; width: 70px; border: 2px solid var(--gold); border-radius: 8px; object-fit: cover; }
        nav { background: var(--midnight); display: flex; justify-content: center; position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; padding: 18px 20px; text-decoration: none; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        
        .form-container { padding: 60px 10%; background: var(--silver); }
        .form-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
        .form-card h2 { color: var(--midnight); border-bottom: 3px solid var(--gold); display: inline-block; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--midnight); }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: var(--midnight); color: white; padding: 15px 30px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: var(--gold); color: var(--midnight); }
        
        footer { background: var(--midnight); color: white; text-align: center; padding: 30px; }
    </style>
</head>
<body>
    <header>
        <div class="h-left"><img src="../assets/people/logo.png" onerror="this.src='https://via.placeholder.com/90'"></div>
        <div class="h-right-principal">
            <div class="p-info"><b>Ms. Pallavi Sharma</b><small>National Awardee</small></div>
            <img src="../assets/people/principal.jpg">
        </div>
    </header>
    <nav>
        <a href="../index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="gallery.html">Gallery</a>
        <a href="circulars.html">Circulars</a>
        <a href="admission.html" style="color:var(--gold);">Admissions</a>
        <a href="showcase.html">Showcase</a>
        <a href="complaints.html">Complaints</a>
    </nav>

    <div class="form-container">
        <div class="form-card">
            <h2>Admission Inquiry 2026-27</h2>
            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
                <div class="input-group">
                    <label>Student's Full Name</label>
                    <input type="text" name="student_name" required>
                </div>
                <div class="input-group">
                    <label>Applying for Grade</label>
                    <select name="grade">
                        <option>Pre-School (Nursery)</option>
                        <option>Pre-Primary (Prep)</option>
                        <option>Grade 1 - 5</option>
                        <option>Grade 6 - 9</option>
                        <option>Grade 11</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Parent/Guardian Mobile</label>
                    <input type="tel" name="phone" required>
                </div>
                <div class="input-group">
                    <label>Additional Remarks</label>
                    <textarea name="message" rows="4"></textarea>
                </div>
                <button type="submit">Submit Inquiry</button>
            </form>
        </div>
    </div>
    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>
</body>
</html>
