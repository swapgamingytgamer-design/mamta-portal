<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Mamta Modern School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --midnight: #0f172a; --accent: #d4af37; --white: #ffffff; --soft-bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--soft-bg); }

        .super-header { background: var(--white); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-img { height: 90px; }
        .school-title h1 { font-size: 1.8rem; font-weight: 900; color: var(--midnight); margin: 0; }
        .school-title p { font-size: 0.85rem; color: var(--accent); font-weight: 700; text-transform: uppercase; }

        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .contact-row { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #000; font-weight: 700; font-size: 1.1rem; }
        .gold-icon { color: var(--accent); }
        .social-icon-row { display: flex; gap: 20px; margin-top: 5px; }
        .dark-social { color: var(--midnight); font-size: 1.8rem; transition: 0.3s; }
        .dark-social:hover { color: var(--accent); transform: translateY(-3px); }

        nav { background: var(--midnight); padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        nav a { color: #cbd5e1; margin: 0 20px; text-decoration: none; font-weight: 700; font-size: 0.9rem; }
        nav a:hover { color: var(--accent); }

        .hero { width: 100%; height: 500px; background: #ddd; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        footer { text-align: center; padding: 40px; background: var(--midnight); color: #cbd5e1; }
        footer b { color: var(--accent); }
    </style>
</head>
<body>
    <header class="super-header">
        <div class="header-left">
            <img src="assets/people/logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/90'">
            <div class="school-title"><h1>MAMTA MODERN SCHOOL</h1><p>EST. 1973 | GOLDEN JUBILEE YEAR</p></div>
        </div>
        <div class="header-right">
            <div class="contact-row"><i class="fa-solid fa-phone gold-icon"></i> +91-11-45614501</div>
            <div class="contact-row"><i class="fa-solid fa-envelope gold-icon"></i> mamtamodernschool@gmail.com</div>
            <div class="social-icon-row">
                <a href="#" class="dark-social"><i class="fa-brands fa-square-youtube"></i></a>
                <a href="#" class="dark-social"><i class="fa-brands fa-circle-facebook"></i></a>
                <a href="#" class="dark-social"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </header>
    <nav>
        <a href="index.html">HOME</a>
        <a href="pages/gallery.html">GALLERY</a>
        <a href="pages/circulars.html">CIRCULARS</a>
        <a href="pages/suppliers.html">SUPPLIERS</a>
    </nav>
    <div class="hero">Hero Slider Section</div>
    <footer><p>© 2026 Mamta Modern School | Developed by <b>Swapneil Jha</b></p></footer>
</body>
</html>
