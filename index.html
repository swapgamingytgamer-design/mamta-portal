<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamta Modern Sr. Sec. School | Home</title>
    <style>
        :root { 
            --midnight: #0f172a; 
            --accent: #d4af37; 
            --soft-bg: #f8fafc;
            --white: #ffffff;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--soft-bg); color: #334155; }

        /* --- HEADER & NAV (Same as before) --- */
        .super-header { background: var(--white); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); }
        .logo-img { height: 85px; }
        nav { background: var(--midnight); padding: 15px; position: sticky; top: 0; z-index: 1000; text-align: center; }
        nav a { color: #cbd5e1; margin: 0 15px; text-decoration: none; font-weight: 600; font-size: 0.85rem; }

        /* --- HERO --- */
        .hero {
            width: 100%; height: 450px;
            background-image: linear-gradient(rgba(15, 23, 42, 0.5), rgba(15, 23, 42, 0.5)), url('assets/events/building.jpg');
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; color: white; border-bottom: 6px solid var(--accent);
        }

        .container { max-width: 1100px; margin: -50px auto 40px; padding: 0 20px; }
        .card { background: var(--white); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); margin-bottom: 30px; }

        /* --- SLIDESHOW BUTTON --- */
        .btn-slideshow {
            background: var(--midnight);
            color: var(--white);
            border: 2px solid var(--accent);
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }
        .btn-slideshow:hover { background: var(--accent); color: var(--midnight); }

        /* --- SLIDESHOW OVERLAY (Hidden by default) --- */
        .slideshow-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .slide-container { position: relative; max-width: 800px; width: 90%; }
        .slide-img { width: 100%; border-radius: 15px; border: 5px solid var(--white); display: none; }
        .active-slide { display: block; animation: fadeIn 0.5s; }

        .close-btn { position: absolute; top: -50px; right: 0; color: white; font-size: 2rem; cursor: pointer; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: var(--accent); color: white; border: none; padding: 15px; cursor: pointer; border-radius: 50%; }
        .prev { left: -70px; }
        .next { right: -70px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        footer { text-align: center; padding: 40px; background: var(--midnight); color: white; }
    </style>
</head>
<body>

    <header class="super-header">
        <div class="header-left">
            <img src="assets/people/logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/85'">
            <div style="margin-left: 20px;">
                <h1 style="color: var(--midnight);">MAMTA MODERN SCHOOL</h1>
                <p style="color: var(--accent); font-weight: bold;">GOLDEN JUBILEE YEAR</p>
            </div>
        </div>
    </header>

    <nav>
        <a href="index.html">HOME</a>
        <a href="pages/gallery.html">GALLERY</a>
        <a href="pages/circulars.html">CIRCULARS</a>
        <a href="pages/suppliers.html">SUPPLIERS</a>
    </nav>

    <div class="hero">
        <h2 style="font-size: 3rem;">50 Years of Excellence</h2>
    </div>

    <div class="container">
        <div class="card" style="text-align: center;">
            <h2>Experience Our Journey</h2>
            <p>Click the button below to view highlights from our recent school events and celebrations.</p>
            <button class="btn-slideshow" onclick="openSlideshow()">📸 View Event Highlights</button>
        </div>
    </div>

    <div id="slideshow" class="slideshow-overlay">
        <div class="slide-container">
            <span class="close-btn" onclick="closeSlideshow()">&times;</span>
            
            <img src="assets/events/award1.jpg" class="slide-img active-slide" onerror="this.src='https://via.placeholder.com/800x500?text=Event+Photo+1'">
            <img src="assets/events/award2.jpg" class="slide-img" onerror="this.src='https://via.placeholder.com/800x500?text=Event+Photo+2'">
            <img src="assets/events/award3.jpg" class="slide-img" onerror="this.src='https://via.placeholder.com/800x500?text=Event+Photo+3'">
            <img src="assets/events/building.jpg" class="slide-img" onerror="this.src='https://via.placeholder.com/800x500?text=School+Building'">

            <button class="nav-btn prev" onclick="changeSlide(-1)">❮</button>
            <button class="nav-btn next" onclick="changeSlide(1)">❯</button>
        </div>
    </div>

    <footer>© 2026 Mamta Modern Sr. Sec. School</footer>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide-img');

        function openSlideshow() {
            document.getElementById('slideshow').style.display = 'flex';
        }

        function closeSlideshow() {
            document.getElementById('slideshow').style.display = 'none';
        }

        function changeSlide(n) {
            slides[currentSlide].classList.remove('active-slide');
            currentSlide = (currentSlide + n + slides.length) % slides.length;
            slides[currentSlide].classList.add('active-slide');
        }

        // Close if user clicks outside the image
        window.onclick = function(event) {
            let modal = document.getElementById('slideshow');
            if (event.target == modal) {
                closeSlideshow();
            }
        }
    </script>
</body>
</html>
