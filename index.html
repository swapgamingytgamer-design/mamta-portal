<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamta Modern School | Official Portal</title>
    <style>
        :root {
            --midnight: #0a192f;
            --accent-gold: #c5a059;
            --school-coral: #ff6b6b;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; color: #333; }
        
        /* BRANDING */
        .header-main { background: var(--white); padding: 20px 10%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent-gold); }
        .logo { height: 80px; }
        nav { background: var(--midnight); padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; }

        /* LAYOUT */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .card { background: var(--white); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 30px; }

        /* PRINCIPAL & AWARDS */
        .prin-section { display: flex; gap: 25px; align-items: flex-start; }
        .prin-img { width: 180px; border-radius: 10px; border: 3px solid var(--accent-gold); }
        .awards-wall { 
            margin-top: 25px; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
            gap: 15px; background: #fffbeb; padding: 20px; border-radius: 10px; border: 1px solid #fde68a; 
        }
        .award-box { text-align: center; }
        .award-box img { width: 100%; height: 80px; object-fit: contain; background: white; border-radius: 6px; border: 1px solid #eee; margin-bottom: 5px; }
        .award-box span { font-size: 0.7rem; font-weight: bold; color: #92400e; display: block; }

        /* CIRCULARS SIDEBAR */
        .sidebar { background: var(--midnight); color: white; padding: 25px; border-radius: 12px; }
        .notice-link { display: flex; align-items: center; gap: 10px; color: #cbd5e1; text-decoration: none; padding: 12px 0; border-bottom: 1px solid #334155; }
        .notice-link:hover { color: white; transform: translateX(5px); transition: 0.3s; }
        
        footer { background: var(--midnight); color: #64748b; text-align: center; padding: 30px; }
    </style>
</head>
<body>

    <header class="header-main">
        <img src="assets/people/logo.png" class="logo" onerror="this.src='https://via.placeholder.com/80?text=Logo'">
        <div style="text-align: center;">
            <h1 style="color: var(--midnight); font-size: 1.8rem;">MAMTA MODERN SR. SEC. SCHOOL</h1>
            <p style="color: var(--accent-gold); font-weight: bold;">VIKAS PURI, NEW DELHI</p>
        </div>
        <div style="width: 80px;"></div>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="#circulars">Circulars</a>
    </nav>

    <div class="container">
        <main>
            <div class="card">
                <div class="prin-section">
                    <img src="assets/people/principal.jpg" class="prin-img" onerror="this.src='https://via.placeholder.com/180?text=Principal'">
                    <div>
                        <h2 style="color: var(--midnight);">Ms. Pallavi Sharma</h2>
                        <p style="color: var(--accent-gold); font-weight: bold; margin-bottom: 10px;">Principal's Desk</p>
                        <p style="font-style: italic; color: #475569;">"Building a legacy of excellence and innovation in education."</p>
                    </div>
                </div>

                <h3 style="margin-top: 30px; color: #b45309;">🏆 Awards & Honors</h3>
                <div class="awards-wall" id="awards-boom"></div>
            </div>
        </main>

        <aside class="sidebar" id="circulars">
            <h3>Notice Board</h3>
            <div id="circulars-boom"></div>
        </aside>
    </div>

    <footer><p>&copy; 2026 Mamta Modern School</p></footer>

    <script>
        // ==========================================
        // THE "DROP & BOOM" LIST
        // When you upload to a host, YOU MUST LIST YOUR FILES HERE:
        // ==========================================
        const SCHOOL_DATA = {
            awards: [
                { title: "Best Principal", img: "award1.jpg" },
                { title: "Excellence", img: "award2.jpg" },
                { title: "Leadership", img: "award3.jpg" },
                { title: "Innovation", img: "award4.jpg" },
                { title: "State Award", img: "award5.jpg" },
                { title: "Merit Award", img: "award6.jpg" },
                { title: "Honor Medal", img: "award7.jpg" }
            ],
            circulars: [
                "Final_Term_Datesheet.pdf",
                "Admission_Form_2026.pdf",
                "Summer_Holiday_List.pdf"
            ]
        };

        function startBoom() {
            // Boom Awards
            document.getElementById('awards-boom').innerHTML = SCHOOL_DATA.awards.map(a => `
                <div class="award-box">
                    <img src="assets/events/${a.img}" onerror="this.src='https://via.placeholder.com/80?text=Award'">
                    <span>${a.title}</span>
                </div>`).join('');

            // Boom Circulars
            document.getElementById('circulars-boom').innerHTML = SCHOOL_DATA.circulars.map(f => {
                let name = f.replace('.pdf','').replace(/_/g,' ');
                return `<a href="circulars/${f}" class="notice-link" target="_blank">📄 ${name}</a>`;
            }).join('');
        }
        window.onload = startBoom;
    </script>
</body>
</html>
