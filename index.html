<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamta Modern Sr. Sec. School | Home</title>
    <style>
        :root { --midnight: #0a192f; --gold: #c5a059; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f1f5f9; color: #333; }

        /* STANDARDIZED TOP SECTION */
        .header-main { background: white; padding: 30px 5%; text-align: center; border-bottom: 4px solid var(--gold); }
        .logo-img { height: 90px; margin-bottom: 10px; }
        nav { background: var(--midnight); padding: 18px; position: sticky; top: 0; z-index: 1000; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        nav a:hover { color: var(--gold); }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        
        /* PRINCIPAL CARD - CLICKABLE */
        .prin-card { 
            background: white; padding: 30px; border-radius: 15px; 
            display: flex; gap: 30px; align-items: center; 
            cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid transparent;
        }
        .prin-card:hover { border-color: var(--gold); transform: translateY(-3px); }
        .prin-img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; }

        /* HIDDEN AWARDS SECTION */
        #awards-panel { 
            display: none; margin-top: 20px; background: #fff; 
            padding: 20px; border-radius: 15px; border: 1px dashed var(--gold);
            animation: fadeIn 0.5s ease;
        }
        .awards-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; }
        .award-item img { width: 100%; border-radius: 8px; border: 1px solid #eee; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .banner-box { width: 100%; border-radius: 15px; overflow: hidden; margin-bottom: 30px; height: 400px; }
        .banner-img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <header class="header-main">
        <img src="assets/people/logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/100'">
        <h1 style="color: var(--midnight);">MAMTA MODERN SR. SEC. SCHOOL</h1>
    </header>

    <nav>
        <a href="index.html">HOME</a>
        <a href="pages/gallery.html">GALLERY</a>
        <a href="pages/circulars.html">CIRCULARS</a>
        <a href="pages/suppliers.html">SUPPLIERS</a>
    </nav>

    <div class="container">
        <div class="banner-box">
            <img src="assets/campus/building.jpg" class="banner-img" onerror="this.src='https://via.placeholder.com/1100x400?text=School+Building'">
        </div>

        <h3 style="margin-bottom:15px; color: var(--midnight);">Principal's Message</h3>
        <div class="prin-card" onclick="toggleAwards()">
            <img src="assets/people/principal.jpg" class="prin-img" onerror="this.src='https://via.placeholder.com/150'">
            <div>
                <h2 style="color: var(--midnight);">Ms. Pallavi Sharma</h2>
                <p style="color: var(--gold); font-weight: bold;">Principal</p>
                <p style="font-size: 0.9rem; color: #666; margin-top: 5px;">Click to view Principal's Awards & Honors 🏆</p>
            </div>
        </div>

        <div id="awards-panel">
            <h4 style="text-align: center; margin-bottom: 15px; color: #b45309;">Principal's Wall of Honor</h4>
            <div class="awards-grid">
                <div class="award-item"><img src="assets/events/award1.jpg" onerror="this.src='https://via.placeholder.com/150?text=Award+1'"></div>
                <div class="award-item"><img src="assets/events/award2.jpg" onerror="this.src='https://via.placeholder.com/150?text=Award+2'"></div>
                <div class="award-item"><img src="assets/events/award3.jpg" onerror="this.src='https://via.placeholder.com/150?text=Award+3'"></div>
                <div class="award-item"><img src="assets/events/award4.jpg" onerror="this.src='https://via.placeholder.com/150?text=Award+4'"></div>
                <div class="award-item"><img src="assets/events/award5.jpg" onerror="this.src='https://via.placeholder.com/150?text=Award+5'"></div>
            </div>
        </div>
    </div>

    <script>
        function toggleAwards() {
            const panel = document.getElementById('awards-panel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }
    </script>
</body>
</html>
