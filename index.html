<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamta Modern Sr. Sec. School | Home</title>
    <style>
        :root { --midnight: #0a192f; --gold: #c5a059; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f8fafc; }
        nav { background: var(--midnight); padding: 20px; position: sticky; top: 0; z-index: 100; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        nav a:hover { color: var(--gold); }
        .header { background: white; padding: 40px 10%; text-align: center; border-bottom: 3px solid var(--gold); }
        .logo { height: 100px; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .prin-card { background: white; padding: 30px; border-radius: 15px; display: flex; gap: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); align-items: center; }
        .prin-img { width: 220px; border-radius: 10px; border: 4px solid var(--gold); }
        .awards-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-top: 20px; }
        .award-item { background: #fffbeb; padding: 10px; border-radius: 8px; border: 1px solid #fde68a; text-align: center; }
        .award-item img { width: 100%; height: 100px; object-fit: contain; background: white; border-radius: 5px; }
        footer { background: var(--midnight); color: white; text-align: center; padding: 30px; margin-top: 50px; }
    </style>
</head>
<body>
    <header class="header">
        <img src="assets/people/logo.png" class="logo" onerror="this.src='https://via.placeholder.com/100'">
        <h1 style="color: var(--midnight);">MAMTA MODERN SR. SEC. SCHOOL</h1>
        <p style="color: var(--gold); font-weight: bold;">VIKAS PURI, NEW DELHI</p>
    </header>
    <nav>
        <a href="index.html">HOME</a>
        <a href="pages/gallery.html">GALLERY</a>
        <a href="pages/circulars.html">CIRCULARS</a>
        <a href="pages/dress.html">SCHOOL DRESS</a>
        <a href="pages/suppliers.html">SUPPLIERS</a>
    </nav>
    <div class="container">
        <div class="prin-card">
            <img src="assets/people/principal.jpg" class="prin-img" onerror="this.src='https://via.placeholder.com/200?text=Principal'">
            <div>
                <h2 style="color: var(--midnight);">Ms. Pallavi Sharma</h2>
                <p style="color: var(--gold); font-weight: bold; margin-bottom: 15px;">Principal, Mamta Modern School</p>
                <p style="font-style: italic; color: #475569;">"Building a legacy of excellence and innovation in education."</p>
            </div>
        </div>
        <div style="margin-top:40px;">
            <h3 style="color: #b45309; text-align: center;">🏆 Principal's Wall of Honor</h3>
            <div class="awards-grid" id="award-container"></div>
        </div>
    </div>
    <footer><p>&copy; 2026 Mamta Modern School</p></footer>
    <script>
        const awards = [{img:"award1.jpg"}, {img:"award2.jpg"}, {img:"award3.jpg"}, {img:"award4.jpg"}, {img:"award5.jpg"}];
        document.getElementById('award-container').innerHTML = awards.map(a => `
            <div class="award-item"><img src="assets/events/${a.img}" onerror="this.src='https://via.placeholder.com/100?text=Award'"></div>
        `).join('');
    </script>
</body>
</html>
