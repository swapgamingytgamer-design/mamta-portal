<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamta Modern Sr. Sec. School | Home</title>
    <style>
        :root { 
            --midnight: #0f172a; 
            --accent: #d4af37; 
            --soft-bg: #f8fafc;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--soft-bg); color: #334155; }

        /* --- NAVIGATION --- */
        nav { background: var(--midnight); padding: 15px; position: sticky; top: 0; z-index: 1000; text-align: center; }
        nav a { color: #cbd5e1; margin: 0 15px; text-decoration: none; font-weight: 600; font-size: 0.85rem; }
        nav a:hover { color: var(--accent); }

        /* --- AUTO-SLIDESHOW HERO --- */
        .hero-slider {
            width: 100%;
            height: 500px;
            position: relative;
            overflow: hidden;
            background: var(--midnight);
            border-bottom: 6px solid var(--accent);
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        .slide.active { opacity: 1; }

        .slide-overlay {
            background: rgba(0, 0, 0, 0.4);
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        .slide-overlay h2 { color: white; font-size: 3rem; font-weight: 900; text-shadow: 2px 2px 15px rgba(0,0,0,0.7); }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        @media (max-width: 768px) { .hero-slider { height: 300px; } .slide-overlay h2 { font-size: 1.5rem; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">HOME</a>
        <a href="pages/gallery.html">GALLERY</a>
        <a href="pages/circulars.html">CIRCULARS</a>
        <a href="pages/suppliers.html">SUPPLIERS</a>
    </nav>

    <div class="hero-slider" id="heroSlider">
        </div>

    <div class="container">
        <div class="card">
            <h2>Welcome to Mamta Modern School</h2>
            <p>Celebrating our Golden Jubilee Year with excellence in education and character building.</p>
        </div>
    </div>

    <script>
        // 1. List every photo you have in your assets folder here
        const photos = [
            'assets/events/building.jpg',
            'assets/events/award1.jpg',
            'assets/events/award2.jpg',
            'assets/events/award3.jpg',
            'assets/events/award4.jpg',
            'assets/people/principal.jpg'
        ];

        const slider = document.getElementById('heroSlider');

        // 2. Automatically create slides for every photo
        photos.forEach((path, index) => {
            const slide = document.createElement('div');
            slide.className = `slide ${index === 0 ? 'active' : ''}`;
            slide.style.backgroundImage = `url('${path}')`;
            
            const overlay = document.createElement('div');
            overlay.className = 'slide-overlay';
            overlay.innerHTML = `<h2>50 Years of Excellence</h2>`;
            
            slide.appendChild(overlay);
            slider.appendChild(slide);
        });

        // 3. Auto-scroll Logic
        let current = 0;
        const allSlides = document.querySelectorAll('.slide');

        function playSlideshow() {
            allSlides[current].classList.remove('active');
            current = (current + 1) % allSlides.length;
            allSlides[current].classList.add('active');
        }

        if(allSlides.length > 0) {
            setInterval(playSlideshow, 4000); // Changes every 4 seconds
        }
    </script>
</body>
</html>
